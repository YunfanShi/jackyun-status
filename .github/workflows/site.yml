name: Status Website
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/site.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Uptime CI']
    types: [completed]
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: status-website
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATUS_LIVE_PROBE: '1'
          STATUS_FETCH_ISSUES: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publish status snapshot and website
        id: deployment
        uses: actions/deploy-pages@v4
