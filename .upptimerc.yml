owner: YunfanShi
repo: jackyun-status
user-agent: YunfanShi

# No endpoint or notification secrets are passed into generated workflows.
secrets: []

sites:
  - name: JackYun Portal
    url: https://jackyun.top
    maxResponseTime: 5000
  - name: 应用与数据库
    url: https://jackyun.top/api/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

assignees:
  - YunfanShi

# Keep short incidents in the public history instead of deleting them.
skipDeleteIssues: true
skipDescriptionUpdate: true

status-website:
  cname: status.jackyun.top
  logoUrl: https://raw.githubusercontent.com/YunfanShi/YunfanShi.github.io/main/Webicon.png
  favicon: https://raw.githubusercontent.com/YunfanShi/YunfanShi.github.io/main/Webicon.png
  name: JackYun 服务状态
  introTitle: "**JackYun** 服务运行状态"
  introMessage: 这里展示 JackYun Portal 及其核心依赖的实时可用性、响应时间和历史故障记录。
  theme: light
  navbar:
    - title: 服务状态
      href: /
    - title: 返回主站
      href: https://jackyun.top
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

